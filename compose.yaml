services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: openforce
      POSTGRES_PASSWORD: openforce
      POSTGRES_DB: openforce
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openforce -d openforce"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
